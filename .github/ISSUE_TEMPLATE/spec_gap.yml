name: Spec gap
description: Report a divergence between the SDK and the authoritative MCP specification.
title: "[spec]: "
labels: ["spec-gap"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when the SDK's wire output, field names, JSON shapes,
        or error codes do not match the authoritative MCP schema for a given
        protocol version.
  - type: input
    id: protocol-version
    attributes:
      label: Protocol version
      description: Which version the gap applies to (e.g. 2026-07-28, 2025-11-25, 2025-06-18).
      placeholder: "2026-07-28"
    validations:
      required: true
  - type: input
    id: spec-reference
    attributes:
      label: Spec reference
      description: Link to the authoritative schema/section (schema.ts line, or modelcontextprotocol.io page).
      placeholder: "https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/schema/2026-07-28/schema.ts#L..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected (per spec)
      description: The exact field names / JSON shape / error code the spec requires.
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual (current SDK behavior)
      description: What the SDK currently produces or accepts, with file:line if known.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: version-scope
    attributes:
      label: Version scope
      description: A fix for one protocol revision must NOT change another revision's wire output.
      options:
        - label: This gap applies to the modern protocol (2026-07-28).
          required: false
        - label: This gap applies to a legacy version (2025-11-25 or earlier).
          required: false
